<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot Slide – sliding puzzle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E6ECF2; --panel:#F8FAFC; --ink:#162030; --steel:#5E6B7D; --line:#C7D1DC;
  --frame:#D3DCE6; --accent:#0B84B0; --accent-bg:#13B4E6; --glow:#49DCFF;
  --night:#0D1828; --danger:#C2412D; --key:#FFFFFF;
  --display:"Chakra Petch", "Rajdhani", "Segoe UI", system-ui, sans-serif;
  --body:"Sora", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101823; --panel:#182230; --ink:#E5ECF4; --steel:#97A5B7; --line:#2B394B;
    --frame:#223042; --accent:#5CD3FA; --accent-bg:#1BA9D8; --night:#070E18; --danger:#F07A63; --key:#223042;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101823; --panel:#182230; --ink:#E5ECF4; --steel:#97A5B7; --line:#2B394B;
  --frame:#223042; --accent:#5CD3FA; --accent-bg:#1BA9D8; --night:#070E18; --danger:#F07A63; --key:#223042;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.screen{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 20px;text-align:center}
.screen[hidden]{display:none}
h1{font-family:var(--display);font-weight:700;font-size:clamp(2rem,5vw,3.4rem);line-height:1.05;margin:0 0 10px;letter-spacing:-.01em}
.lede{margin:0 0 26px;color:var(--steel);max-width:46ch}
.note{color:var(--danger);font-weight:500;margin:0 0 14px;min-height:1.5em}

/* name screen */
.namebox{width:min(100%,560px)}
.nameRow{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.4rem;padding:14px 16px;border:2px solid var(--line);border-radius:14px;background:var(--panel);color:var(--ink);text-align:center}
input[type=text]:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(19,180,230,.25)}
.btn{font:inherit;font-weight:600;font-size:1.1rem;padding:14px 26px;border:0;border-radius:14px;background:var(--accent-bg);color:#04202C;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.kbd{margin-top:22px;display:flex;flex-direction:column;gap:8px;width:min(100%,760px);user-select:none;-webkit-user-select:none}
.kbd[hidden]{display:none}
.krow{display:flex;gap:8px;justify-content:center}
.kbd button{flex:1;max-width:66px;height:58px;font:inherit;font-size:1.25rem;font-weight:500;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:10px;background:var(--key);color:var(--ink);cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.kbd button:active{transform:translateY(2px);border-bottom-width:1.5px}
.kbd .wide{max-width:150px;flex:2;font-size:1rem}
.kbd .space{max-width:380px;flex:6}
@media (max-width:520px){.kbd button{height:46px;font-size:1rem}.krow{gap:5px}.kbd{gap:6px}}

/* game screen */
.hud{display:flex;align-items:baseline;justify-content:space-between;gap:16px;width:var(--bw);margin-bottom:10px;text-align:left}
.player{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.player small{display:block;color:var(--steel);font-weight:400;font-size:.85rem}
.clock{font-family:var(--display);font-weight:600;font-size:clamp(2rem,5vw,2.8rem);line-height:1;font-variant-numeric:tabular-nums}
#game{--bw:min(calc(100vw - 40px), calc((100svh - 150px) * .75), 560px)}
.frame{border:3px solid var(--ink);border-radius:20px;padding:12px;background:var(--frame);width:var(--bw);transition:background .6s ease}
.board{position:relative;width:100%;aspect-ratio:3/4;border-radius:10px;outline:none}
.board:focus-visible{box-shadow:0 0 0 3px var(--accent)}
.tile{position:absolute;top:0;left:0;width:calc(100%/3);height:25%;border:0;padding:0;margin:0;background:none;cursor:pointer;transition:transform .14s ease, opacity .5s ease;-webkit-tap-highlight-color:transparent}
.tile i{display:block;width:100%;height:100%;border-radius:9px;background-color:#fff;background-image:var(--img);background-size:300% 400%;background-repeat:no-repeat;
  box-shadow:inset 0 0 0 2px var(--frame), inset 0 0 0 3px rgba(22,32,48,.12);transition:border-radius .4s ease, box-shadow .4s ease}
.tile:hover i{box-shadow:inset 0 0 0 2px var(--frame), inset 0 0 0 4px var(--accent-bg)}
.tile.missing{opacity:0;pointer-events:none}
.board.locked .tile{cursor:default}
.frame.solved{background:var(--night)}
.board.solved .tile i{border-radius:0;box-shadow:none}
.board.glow .tile{opacity:0}
.reveal{position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none;transition:opacity .5s ease}
.board.glow .reveal{opacity:1;animation:glow 1.8s ease-in-out infinite}
@keyframes glow{
  0%,100%{filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 4px var(--glow)) drop-shadow(0 0 10px var(--glow))}
  50%{filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 9px var(--glow)) drop-shadow(0 0 26px var(--glow)) drop-shadow(0 0 48px rgba(73,220,255,.55))}
}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;width:var(--bw);margin-top:12px}
.bar span{display:block;height:100%;width:100%;background:var(--accent-bg);transform-origin:left}
.bar.low span{background:var(--danger)}
.sub{display:flex;justify-content:space-between;width:var(--bw);color:var(--steel);font-size:.875rem;margin-top:6px}

/* leaderboard screen */
.result{font-family:var(--display);font-weight:600;font-size:clamp(1.1rem,2.6vw,1.4rem);color:var(--accent);margin:0 0 22px}
.lbwrap{width:min(100%,520px);background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 20px;margin-bottom:24px;text-align:left}
ol.lb{list-style:none;margin:0;padding:0;counter-reset:r}
ol.lb li{counter-increment:r;display:grid;grid-template-columns:2.5ch 1fr auto;gap:12px;align-items:center;padding:10px 6px;border-top:1px solid var(--line)}
ol.lb li:first-child{border-top:0}
ol.lb li::before{content:counter(r);font-family:var(--display);font-weight:700;font-size:1.1rem;color:var(--steel)}
ol.lb li:first-child::before{color:var(--accent)}
ol.lb .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
ol.lb .who small{display:block;color:var(--steel);font-size:.75rem;font-weight:400}
ol.lb .t{font-family:var(--display);font-weight:600;font-size:1.15rem;font-variant-numeric:tabular-nums}
ol.lb li.me{background:linear-gradient(90deg, rgba(19,180,230,.18), transparent);border-radius:8px}
.empty{color:var(--steel);margin:10px 0}
.src{color:var(--steel);font-size:.75rem;margin:-14px 0 20px}

@media (prefers-reduced-motion: reduce){
  .tile,.tile i,.frame,.reveal{transition:none}
  .board.glow .reveal{animation:none;filter:drop-shadow(0 0 2px #fff) drop-shadow(0 0 9px var(--glow)) drop-shadow(0 0 24px var(--glow))}
}
</style>
</head>
<body>

<section class="screen" id="screenName">
  <h1>Put the robot back together</h1>
  <p class="lede">Slide the tiles into the empty space until the robot is whole. You have 5 minutes – fastest time wins.</p>
  <p class="note" id="note" role="status"></p>
  <div class="namebox">
    <div class="nameRow">
      <input type="text" id="name" maxlength="20" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Your name" aria-label="Your name">
      <button class="btn" id="start" type="button" disabled>Start</button>
    </div>
  </div>
  <div class="kbd" id="kbd" hidden aria-label="On-screen keyboard"></div>
</section>

<section class="screen" id="game" hidden>
  <div class="hud">
    <div class="player"><span id="pname"></span><small id="moves">0 moves</small></div>

  <div class="lbwrap">
    <ol class="lb" id="lb"></ol>
    <p class="empty" id="lbEmpty">No times yet.</p>
  </div>
  <p class="src" id="lbSrc">Saved on this device</p>
  <button class="btn" id="again" type="button">Play again</button>
</section>

<script>
(() => {
  const COLS = 3, ROWS = 4, N = COLS * ROWS;
  const BLANK = (ROWS - 1) * COLS;   // bottom-left square is empty in the picture
  const LIMIT = 5 * 60 * 1000;
  const $ = id => document.getElementById(id);
  const boardEl = $('board'), frameEl = $('frame');
  boardEl.style.setProperty('--img', `url("${$('reveal').src}")`);

  const screens = ['screenName', 'game', 'screenBoard'];
  const show = id => screens.forEach(s => $(s).hidden = s !== id);

  // ---------- name screen + on-screen keyboard ----------
  const nameEl = $('name'), startEl = $('start');
  const touch = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 0;
  const syncStart = () => { startEl.disabled = !nameEl.value.trim(); };
  nameEl.addEventListener('input', syncStart);
  nameEl.addEventListener('keydown', e => { if (e.key === 'Enter' && nameEl.value.trim()) start(); });
  startEl.addEventListener('click', start);

  if (touch) {
    nameEl.setAttribute('inputmode', 'none');   // keep the device keyboard out of the way
    const rows = ['1234567890', 'QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
    const kbd = $('kbd');
    const press = ch => {
      let v = nameEl.value;
      if (ch === '⌫') v = v.slice(0, -1);
      else if (v.length < 20) {
        const cap = v === '' || v.endsWith(' ');
        v += ch === ' ' ? (v && !v.endsWith(' ') ? ' ' : '') : (cap ? ch : ch.toLowerCase());
      }
      nameEl.value = v; syncStart();
    };
    rows.forEach((r, i) => {
      const row = document.createElement('div'); row.className = 'krow';
      [...r].forEach(ch => row.appendChild(key(ch, ch)));
      if (i === 3) { row.appendChild(key('-', '-')); const bk = key('⌫', '⌫'); bk.className = 'wide'; bk.setAttribute('aria-label', 'Delete'); row.appendChild(bk); }
      kbd.appendChild(row);
    });
    const last = document.createElement('div'); last.className = 'krow';
    const sp = key('Space', ' '); sp.className = 'space'; last.appendChild(sp);
    kbd.appendChild(last);
    kbd.hidden = false;
    function key(label, ch) {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = label;
      b.addEventListener('click', () => press(ch));
      return b;
    }
  }

  // ---------- tiles ----------
  const tiles = [];
  for (let id = 0; id < N; id++) {
    const b = document.createElement('button');
    b.type = 'button'; b.tabIndex = -1;
    b.className = 'tile' + (id === BLANK ? ' missing' : '');
    b.setAttribute('aria-label', `Tile ${id + 1}`);
    const i = document.createElement('i');
    i.style.backgroundPosition = `${(id % COLS) / (COLS - 1) * 100}% ${Math.floor(id / COLS) / (ROWS - 1) * 100}%`;
    b.appendChild(i);
    b.addEventListener('click', () => tryMove(id));
    boardEl.appendChild(b);
    tiles.push(b);
  }

  let board = [...Array(N).keys()];
  let state = 'idle', t0 = 0, elapsed = 0, moves = 0, raf = 0, toBoard = 0;

  const render = () => board.forEach((id, pos) => {
    tiles[id].style.transform = `translate(${(pos % COLS) * 100}%, ${Math.floor(pos / COLS) * 100}%)`;
  });
  const neighbors = p => {
    const c = p % COLS, r = Math.floor(p / COLS), out = [];
    if (c > 0) out.push(p - 1); if (c < COLS - 1) out.push(p + 1);
    if (r > 0) out.push(p - COLS); if (r < ROWS - 1) out.push(p + COLS);
    return out;
  };
  const isSolved = () => board.every((id, pos) => id === pos);

  function shuffle() {
    board = [...Array(N).keys()];
    let blank = BLANK, prev = -1;
    do {
      for (let k = 0; k < 300; k++) {
        const opts = neighbors(blank).filter(p => p !== prev);
        const p = opts[Math.floor(Math.random() * opts.length)];
        [board[blank], board[p]] = [board[p], board[blank]];
        prev = blank; blank = p;
      }
    } while (isSolved());
  }

  function tryMove(id) {
    if (state !== 'playing') return;
    const pos = board.indexOf(id), blank = board.indexOf(BLANK);
    const pc = pos % COLS, pr = Math.floor(pos / COLS), bc = blank % COLS, br = Math.floor(blank / COLS);
    let step;
    if (pr === br && pc !== bc) step = pc > bc ? 1 : -1;
    else if (pc === bc && pr !== br) step = pr > br ? COLS : -COLS;
    else return;
    let b = blank, n = 0;
    while (b !== pos) { const nx = b + step; [board[b], board[nx]] = [board[nx], board[b]]; b = nx; n++; }
    moves += n;
    $('moves').textContent = `${moves} move${moves === 1 ? '' : 's'}`;
    render();
    if (isSolved()) win();
  }
  boardEl.addEventListener('keydown', e => {
    const map = { ArrowUp: COLS, ArrowDown: -COLS, ArrowLeft: 1, ArrowRight: -1 };
    if (!(e.key in map)) return;
    e.preventDefault();
    const blank = board.indexOf(BLANK), from = blank + map[e.key];
    if (neighbors(blank).includes(from)) tryMove(board[from]);
  });

  // ---------- clock ----------
  const fmt = ms => { const s = ms / 1000; return `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`; };
  function paintClock() {
    const rest = LIMIT - elapsed, s = Math.max(0, Math.ceil(rest / 1000));
    $('clock').textContent = fmt(Math.min(elapsed, LIMIT));
    $('left').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')} left`;
    $('barFill').style.transform = `scaleX(${Math.max(0, rest / LIMIT)})`;
    $('bar').classList.toggle('low', rest < 30000);
  }

  // ---------- flow ----------
  function start() {
    const name = nameEl.value.trim();
    if (!name) return;
    clearTimeout(toBoard);
    boardEl.classList.remove('solved', 'glow', 'locked');
    frameEl.classList.remove('solved');
    $('pname').textContent = name;
    shuffle(); render();
    moves = 0; elapsed = 0; $('moves').textContent = '0 moves';
    paintClock(); show('game'); boardEl.focus();
    state = 'playing'; t0 = performance.now();
    const tick = now => {
      if (state !== 'playing') return;
      elapsed = now - t0;
      if (elapsed >= LIMIT) { timeUp(); return; }
      paintClock(); raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }
  function backToStart(message) {
    state = 'idle';
    nameEl.value = ''; syncStart();
    $('note').textContent = message || '';
    show('screenName');
    if (!touch) nameEl.focus();
  }
  function timeUp() {
    cancelAnimationFrame(raf);
    backToStart('Time ran out. Give it another go.');
  }
  function win() {
    cancelAnimationFrame(raf);
    elapsed = performance.now() - t0; paintClock();
    state = 'won';
    boardEl.classList.add('locked', 'solved'); frameEl.classList.add('solved');
    setTimeout(() => boardEl.classList.add('glow'), 450);
    const entry = { name: nameEl.value.trim().slice(0, 20), timeMs: Math.round(elapsed), moves, at: Date.now() };
    saveScore(entry);
    toBoard = setTimeout(() => { show('screenBoard'); $('again').focus(); }, 3500);
  }
  $('again').addEventListener('click', () => backToStart(''));

  // ---------- leaderboard ----------
  const LS_KEY = 'robot-slide-scores';
  let db = null, myId = null, myTime = null, lastRows = [];
  const loadLocal = () => { try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { return []; } };
  const saveLocal = list => { try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch {} };

  function renderBoard(rows) {
    const ol = $('lb'); ol.textContent = '';
    rows.slice(0, 10).forEach(r => {
      const li = document.createElement('li');
      if (r.id && r.id === myId) li.className = 'me';
      const who = document.createElement('span'); who.className = 'who';
      who.textContent = String(r.name || 'Player');
      const sm = document.createElement('small'); sm.textContent = `${r.moves} moves`; who.appendChild(sm);
      const t = document.createElement('span'); t.className = 't'; t.textContent = fmt(Number(r.timeMs) || 0);
      li.append(who, t); ol.appendChild(li);
    });
    $('lbEmpty').hidden = rows.length > 0;
    if (myTime != null) {
      const idx = rows.slice(0, 10).findIndex(r => r.id === myId);
      $('result').textContent = idx >= 0
        ? `You solved it in ${fmt(myTime)} – that’s #${idx + 1}`
        : `You solved it in ${fmt(myTime)}`;
    }
  }
  const renderLocal = () => renderBoard(loadLocal().sort((a, b) => a.timeMs - b.timeMs));
  renderLocal();

  async function saveScore(entry) {
    myTime = entry.timeMs; myId = null;
    $('result').textContent = `You solved it in ${fmt(myTime)}`;
    if (db) {
      try { const ref = await db.collection('scores').add(entry); myId = ref.id; renderBoard(lastRows); return; }
      catch (e) { /* fall back to this device */ }
    }
    myId = 'l' + entry.at;
    const list = loadLocal(); list.push({ ...entry, id: myId });
    list.sort((a, b) => a.timeMs - b.timeMs); saveLocal(list.slice(0, 50));
    renderLocal();
  }

  (async () => {
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
    if (!db) return;
    const timer = setTimeout(() => { $('lbSrc').textContent = 'Shared leaderboard is slow to load – showing this device.'; }, 10000);
    db.collection('scores').orderBy('timeMs', 'asc').limit(10).onSnapshot(snap => {
      clearTimeout(timer);
      lastRows = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      $('lbSrc').textContent = 'Shared leaderboard – updates live';
      renderBoard(lastRows);
    }, () => {
      clearTimeout(timer); db = null;
      $('lbSrc').textContent = 'Saved on this device'; renderLocal();
    });
  })();

  show('screenName');
  if (!touch) nameEl.focus();
})();
</script>
</body>
</html>
